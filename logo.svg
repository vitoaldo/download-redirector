    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background App Rounded Rectangle -->
  <rect width="200" height="200" rx="45" fill="url(#grad1)" />
  
  <!-- Folder Back -->
  <path d="M 45 65 L 75 65 L 90 85 L 155 85 C 160 85 165 90 165 95 L 165 140 C 165 145 160 150 155 150 L 45 150 C 40 150 35 145 35 140 L 35 75 C 35 70 40 65 45 65 Z" fill="#ffffff" opacity="0.35" />
  
  <!-- Folder Front -->
  <path d="M 35 90 L 165 90 L 155 150 C 155 155 150 160 145 160 L 45 160 C 40 160 35 155 35 150 Z" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Redirect / Download Arrows inside folder -->
  <!-- Main down arrow -->
  <path d="M 100 100 L 100 140 M 80 120 L 100 140 L 120 120" stroke="#007acc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
