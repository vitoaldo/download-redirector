name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build Installer & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependências
        run: dotnet restore

      - name: Publicar (single-file, self-contained)
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o ./publish

      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Extrair versão da tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verificar arquivos antes do Inno Setup
        shell: pwsh
        run: |
          Write-Host "=== Diretorio de trabalho ==="
          Get-Location
          Write-Host "=== Conteudo de publish/ ==="
          Get-ChildItem -Path publish -ErrorAction SilentlyContinue
          Write-Host "=== LICENSE ==="
          Test-Path LICENSE
          Write-Host "=== installer/ ==="
          Get-ChildItem -Path installer -ErrorAction SilentlyContinue
          Write-Host "=== ISCC.exe ==="
          Get-ChildItem -Path "C:\Program Files (x86)\Inno Setup*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Gerar instalador (.exe)
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem -Path "C:\Program Files (x86)\Inno Setup*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) { Write-Error "ISCC.exe nao encontrado"; exit 1 }
          Write-Host "ISCC encontrado em: $iscc"
          Write-Host "Versao: ${{ steps.version.outputs.VERSION }}"
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "publish"
          $licenseFile = Join-Path $env:GITHUB_WORKSPACE "LICENSE"
          Write-Host "PublishDir: $publishDir"
          Write-Host "LicenseFile: $licenseFile"
          & $iscc /DMyAppVersion=${{ steps.version.outputs.VERSION }} /DPublishDir="$publishDir" /DLicenseDir="$licenseFile" "installer\installer.iss"

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          generate_release_notes: true
